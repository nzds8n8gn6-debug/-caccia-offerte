<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CacciaOfferte">
    <title>CacciaOfferte Pro</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sec: #8e8e93;
            --accent: #007aff;
            --green: #34c759;
            --red: #ff3b30;
            --orange: #ff9500;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }
        
        /* Intestazione */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 16px 12px;
            border-bottom: 1px solid #e5e5ea;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .header-btns { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .icon-btn.secondary { background: #e5e5ea; color: var(--text-main); font-size: 16px; }

        /* Barra di ricerca */
        .search-bar {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            background: #e5e5ea;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }

        /* Filtri */
        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .filter-btn {
            background: #e5e5ea;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            cursor: pointer;
        }
        .filter-btn.active { background: var(--accent); color: white; }

        /* Banner Ricerca Rapida Esterna */
        .quick-compare-banner {
            margin: 12px 16px 0;
            padding: 12px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .quick-compare-banner p { margin: 0; font-size: 13px; color: var(--text-sec); font-weight: 600; }
        .compare-links { display: flex; gap: 8px; }
        .compare-pill {
            flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px;
            font-size: 12px; font-weight: 700; text-decoration: none; color: white;
        }

        /* Lista Prodotti */
        .container { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .store-tag { font-size: 11px; font-weight: 700; color: var(--text-sec); text-transform: uppercase; }
        .discount-badge { background: var(--red); color: white; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
        
        .card-body { display: flex; gap: 14px; align-items: center; }
        .icon-box {
            width: 56px; height: 56px;
            background: rgba(0, 122, 255, 0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; flex-shrink: 0;
        }
        .info { flex: 1; }
        .title { font-size: 16px; font-weight: 600; margin: 0 0 6px; line-height: 1.3; }
        .prices { display: flex; align-items: baseline; gap: 8px; }
        .price-now { font-size: 20px; font-weight: 800; color: var(--green); }
        .price-old { font-size: 14px; color: var(--text-sec); text-decoration: line-through; }

        /* Confronto Prezzi per singolo prodotto */
        .mini-compare { display: flex; gap: 6px; border-top: 1px solid #f2f2f7; padding-top: 10px; }
        .mini-btn {
            flex: 1; text-align: center; padding: 6px; border-radius: 8px;
            font-size: 12px; font-weight: 600; text-decoration: none;
            background: #f2f2f7; color: var(--text-main);
        }

        /* Pulsanti azione */
        .card-actions { display: flex; gap: 8px; }
        .btn-buy {
            flex: 1; background: var(--accent); color: white; text-align: center;
            text-decoration: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 15px;
        }
        .btn-fav, .btn-del {
            background: #f2f2f7; border: none; width: 42px; border-radius: 10px; font-size: 16px; cursor: pointer;
        }

        /* Modali (Finestre a comparsa) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .modal-content h2 { margin: 0 0 4px; font-size: 20px; }
        .modal-content input, .modal-content select {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d1d1d6; font-size: 15px;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
        .btn-save { flex: 1; background: var(--green); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 15px; }
        .btn-cancel { flex: 1; background: #e5e5ea; color: var(--text-main); border: none; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 15px; }
        .status-msg { font-size: 12px; color: var(--text-sec); text-align: center; margin-top: 4px; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h1>Offerte Live</h1>
        <div class="header-btns">
            <button class="icon-btn secondary" onclick="syncGoogleSheet()" title="Aggiorna prezzi">🔄</button>
            <button class="icon-btn secondary" onclick="openModal('sheetModal')" title="Collega Foglio Google">⚙️</button>
            <button class="icon-btn" onclick="openModal('addModal')" title="Aggiungi offerta">+</button>
        </div>
    </div>
    <input type="text" id="searchInput" class="search-bar" placeholder="Cerca scarpe, TV, console...">
    <div class="filters">
        <button class="filter-btn active" data-cat="tutte">Tutte</button>
        <button class="filter-btn" data-cat="scarpe">👟 Scarpe Uomo</button>
        <button class="filter-btn" data-cat="tech">🎮 Tech & TV</button>
        <button class="filter-btn" data-cat="preferiti">❤️ Preferiti</button>
    </div>
</header>

<!-- Barra per cercare subito su siti esterni quello che scrivi nella ricerca -->
<div class="quick-compare-banner" id="quickCompareBanner">
    <p>Confronta subito "<span id="searchTermDisplay"></span>" online:</p>
    <div class="compare-links">
        <a id="linkAmazon" href="#" target="_blank" class="compare-pill" style="background:#ff9900;">Amazon</a>
        <a id="linkIdealo" href="#" target="_blank" class="compare-pill" style="background:#0a3761;">Idealo</a>
        <a id="linkTrovaprezzi" href="#" target="_blank" class="compare-pill" style="background:#e65100;">Trovaprezzi</a>
    </div>
</div>

<div class="status-msg" id="syncStatus"></div>
<div class="container" id="offersList"></div>

<!-- Modale Aggiungi Offerta Manuale -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <h2>Nuova Offerta</h2>
        <input type="text" id="newTitle" placeholder="Nome prodotto (es. Nike Air Max)">
        <select id="newCat">
            <option value="scarpe">👟 Scarpe Uomo</option>
            <option value="tech">🎮 Tech & Intrattenimento</option>
        </select>
        <input type="number" step="0.01" id="newPrice" placeholder="Prezzo scontato (€)">
        <input type="number" step="0.01" id="newOrig" placeholder="Prezzo originale (€)">
        <input type="text" id="newStore" placeholder="Negozio (es. Amazon, Zalando)">
        <input type="url" id="newLink" placeholder="Link diretto (opzionale)">
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal('addModal')">Annulla</button>
            <button class="btn-save" onclick="addManualOffer()">Salva</button>
        </div>
    </div>
</div>

<!-- Modale Configurazione Google Sheets -->
<div class="modal" id="sheetModal">
    <div class="modal-content">
        <h2>Sincronizza Google Fogli</h2>
        <p style="font-size:13px; color:#666; margin:0;">Incolla il link CSV del tuo Foglio Google pubblicato sul web per aggiornare i prezzi in automatico.</p>
